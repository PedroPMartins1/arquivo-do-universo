services:
  - type: web
    name: arquivo-do-universo-teste
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arquivo-do-universo-teste-db
          property: connectionString
      - key: ARQUIVO_AUTH_RATE_LIMIT_KEY
        generateValue: true
      - key: ARQUIVO_ANTHROPIC_API_KEY
        sync: false
databases:
  - name: arquivo-do-universo-teste-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    databaseName: arquivo
    user: arquivo
    ipAllowList: []
