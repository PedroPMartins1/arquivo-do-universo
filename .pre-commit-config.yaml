repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check --fix .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy src tests'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: frontend-lint
        name: eslint
        entry: bash -c 'cd frontend && pnpm lint'
        language: system
        files: ^frontend/src/
        pass_filenames: false
